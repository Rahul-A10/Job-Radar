name: Check career pages
on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:
  push:
    paths: [careers.json]
permissions:
  contents: write
concurrency: check-jobs
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests beautifulsoup4 playwright && playwright install --with-deps chromium
      - run: python scripts/check_jobs.py
      - run: |
          git config user.name "job-radar-bot"
          git config user.email "job-radar-bot@users.noreply.github.com"
          git add jobs.json
          git diff --cached --quiet || (git commit -m "Update jobs" && git pull --rebase -q && git push)
